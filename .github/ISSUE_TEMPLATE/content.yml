name: "[content] Content Task"
description: Articles, copywriting, editorial planning, and content refreshes
title: "[content] "
labels: ["content", "luna"]
body:
  - type: markdown
    attributes:
      value: "**Routed to: Luna (Content Architect)**"
  - type: textarea
    id: description
    attributes:
      label: What content needs to be written?
      placeholder: Describe the content task...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: What does "done" look like?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0 - Blocking, P1 - High, P2 - Normal, P3 - Low]
    validations:
      required: true
