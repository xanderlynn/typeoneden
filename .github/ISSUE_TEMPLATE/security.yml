name: "[security] Security Review"
description: Security hardening, compliance, privacy, and risk review
title: "[security] "
labels: ["security", "snape"]
body:
  - type: markdown
    attributes:
      value: "**Routed to: Snape (Security Reviewer)**"
  - type: textarea
    id: description
    attributes:
      label: What security or compliance issue needs review?
      placeholder: Describe the security review task...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: What does "done" look like?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0 - Blocking, P1 - High, P2 - Normal, P3 - Low]
    validations:
      required: true
