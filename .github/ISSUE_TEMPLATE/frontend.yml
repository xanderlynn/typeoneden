name: "[frontend] Frontend Task"
description: Page builds, UI components, layouts, and Astro implementation
title: "[frontend] "
labels: ["frontend", "harry"]
body:
  - type: markdown
    attributes:
      value: "**Routed to: Harry (Frontend Engineer)**"
  - type: textarea
    id: description
    attributes:
      label: What page or component needs to be built?
      placeholder: Describe the frontend task...
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      placeholder: What does "done" look like?
    validations:
      required: true
  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options: [P0 - Blocking, P1 - High, P2 - Normal, P3 - Low]
    validations:
      required: true
